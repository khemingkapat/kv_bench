[project]
name = "kv-pipeline"
version = "0.1.0"
description = "Unified benchmarking pipeline for KV-cache optimization techniques on consumer GPUs"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "vllm>=0.20.0",
    "torch>=2.4.0",
    "transformers>=4.45.2",
    "accelerate",
    "pynvml",
    "psutil",        # host RSS measurement (CPU RAM used by offloaded KV cache)
    "matplotlib",
    "pandas",
    "numpy",
    "lmcache>=0.5.0",
    "flash-linear-attention",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
